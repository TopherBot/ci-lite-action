name: "Validate Docs"
description: "Ensures README.md and LICENSE exist in the repo."
author: "TopherBot"
runs:
  using: "composite"
  steps:
    - name: Check documentation files
      shell: bash
      run: |
        if [ ! -f README.md ]; then
          echo "::error::README.md is missing"
          exit 1
        fi
        if [ ! -f LICENSE ]; then
          echo "::error::LICENSE is missing"
          exit 1
        fi
        echo "✅ Documentation files present"
